<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВАШ ТЕЛЕФОН ВЗЛОМАН!</title>
    <style>
        body {
            background-color: red;
            color: white;
            font-size: 30px;
            text-align: center;
            font-weight: bold;
            margin-top: 20%;
        }
        #stop {
            background-color: black;
            color: white;
            font-size: 20px;
            padding: 10px;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <p>ВАШ ТЕЛЕФОН ВЗЛОМАН!</p>
    <p>Система уничтожает данные...</p>
    <button id="stop">ОТМЕНИТЬ</button>
    
    <audio id="siren" src="https://freesound.org/data/previews/342/342211_5865516-lq.mp3" loop></audio>

    <script>
        // Включаем звук сирены
        document.getElementById("siren").play();

        // Включаем вибрацию, если поддерживается
        if ("vibrate" in navigator) {
            setInterval(() => {
                navigator.vibrate([500, 200, 500, 200]);
            }, 2000);
        }

        // Остановка всего по нажатию кнопки
        document.getElementById("stop").addEventListener("click", function() {
            document.getElementById("siren").pause();
            navigator.vibrate(0);
            alert("Пранк отменён!");
        });
    </script>
</body>
</html>
