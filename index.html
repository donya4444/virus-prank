<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВАШ ТЕЛЕФОН ВЗЛОМАН!</title>
    <style>
        body {
            background-color: red;
            color: white;
            font-size: 30px;
            text-align: center;
            font-weight: bold;
            margin-top: 20%;
        }
        #stop {
            background-color: black;
            color: white;
            font-size: 20px;
            padding: 10px;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <p>ВАШ ТЕЛЕФОН ВЗЛОМАН!</p>
    <p>Система уничтожает данные...</p>
    <button id="stop">ОТМЕНИТЬ</button>

    <audio id="siren" src="https://www.myinstants.com/media/sounds/police.mp3" loop></audio>

    <script>
        // Запуск звука сирены
        let siren = document.getElementById("siren");
        siren.play();

        // Вибрация телефона
        function vibratePhone() {
            if (navigator.vibrate) {
                navigator.vibrate([500, 500, 500]); // Вибрация 3 раза
            }
        }
        vibratePhone();
        setInterval(vibratePhone, 3000); // Вибрация каждые 3 секунды

        // Остановка "взлома"
        document.getElementById("stop").addEventListener("click", function() {
            document.body.style.backgroundColor = "black";
            document.body.innerHTML = "<p>Шутка окончена! &#128521;</p>";
            siren.pause();
            navigator.vibrate(0);
        });
    </script>
</body>
</html>
