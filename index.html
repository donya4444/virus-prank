<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВАШ ТЕЛЕФОН ВЗЛОМАН!</title>
    <style>
        body {
            background-color: red;
            color: white;
            font-size: 30px;
            text-align: center;
            font-weight: bold;
            margin-top: 20%;
        }
        #start, #stop {
            background-color: black;
            color: white;
            font-size: 20px;
            padding: 10px;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <p>ВАШ ТЕЛЕФОН ВЗЛОМАН!</p>
    <p>Система уничтожает данные...</p>
    
    <button id="start">ЗАПУСТИТЬ</button>
    <button id="stop" style="display:none;">ОТМЕНИТЬ</button>

    <!-- Аудио с сиреной -->
    <audio id="siren" src="https://www.myinstants.com/media/sounds/police.mp3" loop></audio>

    <script>
        let audio = document.getElementById("siren");

        document.getElementById("start").addEventListener("click", function() {
            audio.play().catch(e => console.log("Автовоспроизведение заблокировано"));
            if (navigator.vibrate) {
                navigator.vibrate([500, 500, 500, 500]);
            }
            document.getElementById("start").style.display = "none";
            document.getElementById("stop").style.display = "inline";
        });

        document.getElementById("stop").addEventListener("click", function() {
            audio.pause();
            audio.currentTime = 0;
            if (navigator.vibrate) {
                navigator.vibrate(0);
            }
        });
    </script>
</body>
</html>
